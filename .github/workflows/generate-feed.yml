name: Generate Kanpo RSS Feed

on:
  schedule:
    # 09:00 JST (00:00 UTC) on weekdays
    - cron: '0 0 * * 1-5'
  workflow_dispatch:
    inputs:
      output-dir:
        description: 'Output directory for feed.xml'
        required: false
        default: 'docs'
      data-dir:
        description: 'Directory for accumulated data (empty string disables accumulation)'
        required: false
        default: 'data'
      max-items:
        description: 'Maximum number of RSS items'
        required: false
        default: '100'
      no-articles:
        description: 'Skip article-level feed generation'
        required: false
        type: boolean
        default: false
      self-url:
        description: 'Self URL for the feed (rel=self link)'
        required: false
        default: ''
      verbose:
        description: 'Enable verbose logging'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install .

      - name: Generate RSS feed
        run: |
          OUTPUT_DIR="${{ github.event.inputs.output-dir }}"
          [ -z "$OUTPUT_DIR" ] && OUTPUT_DIR="docs"
          DATA_DIR="${{ github.event.inputs.data-dir }}"
          [ -z "$DATA_DIR" ] && DATA_DIR="data"
          MAX_ITEMS="${{ github.event.inputs.max-items }}"
          [ -z "$MAX_ITEMS" ] && MAX_ITEMS="100"
          ARGS="--output-dir $OUTPUT_DIR --data-dir $DATA_DIR --max-items $MAX_ITEMS"
          [ "${{ github.event.inputs.no-articles }}" = "true" ] && ARGS="$ARGS --no-articles"
          [ -n "${{ github.event.inputs.self-url }}" ] && ARGS="$ARGS --self-url '${{ github.event.inputs.self-url }}'"
          [ "${{ github.event.inputs.verbose }}" = "true" ] && ARGS="$ARGS -v"
          python -m kanpo_rss $ARGS

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/issues.json
          git diff --cached --quiet || git commit -m "chore: update gazette data [skip ci]"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
